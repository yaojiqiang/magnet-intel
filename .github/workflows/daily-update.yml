name: Daily Magnet Intel Update

# 每天北京时间 12:00（UTC 04:00）自动运行；也可在 Actions 页面手动触发
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write   # 允许 workflow 提交并推送数据更新

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run update script (LLM fetch + generate)
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'cn-free' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOUBAO_SEARCH_API_KEY: ${{ secrets.DOUBAO_SEARCH_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DATA_PATH: data/intelligence.json
          # 每日更新摘要邮件推送（SMTP 凭据；未配置则仅输出日志摘要）
          # 发件方默认使用 163 邮箱（smtp.163.com:465 SSL）；收件人默认 yaojiqiang@zhmag.com
          # 注意：163 发信密码不是登录密码，必须是「客户端授权码」，请存为仓库 Secret：SMTP_PASS
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.163.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'yaojiq@163.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL || 'yaojiqiang@zhmag.com' }}
        run: python scripts/update_intel.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/intelligence.json
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "auto: update intelligence $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
