name: Daily Magnet Intel Update

# 每天北京时间 11:30（UTC 03:30）兜底触发（GitHub 定时会漂移，精确 12:00 由 cron-job.org 负责）；也可在 Actions 页面手动触发
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily=日常增量更新；backfill=一次性回填历史(放宽时间窗充实列表)'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - backfill

permissions:
  contents: write   # 允许 workflow 提交并推送数据更新

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run update script (LLM fetch + generate)
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOUBAO_SEARCH_API_KEY: ${{ secrets.DOUBAO_SEARCH_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DATA_PATH: data/intelligence.json
          # 回填模式：在 Actions 页面手动触发并选择 mode=backfill 时设为 1，
          # 脚本会放宽时间窗(2025至今)以一次性补齐历史动态/新闻，使列表立刻丰富。
          BACKFILL: ${{ github.event.inputs.mode == 'backfill' && '1' || '' }}
          # 每日更新摘要：主推网站内「每日更新记录」标签页（脚本自动写入 data/update-history.json，免配置、免授权码）
          # 邮件推送为可选项：仅当配置了 SMTP_* / NOTIFY_EMAIL 时才发信（当前未启用，且各邮箱需各自授权码）
          # 发件方默认 163 邮箱（smtp.163.com:465 SSL）；收件人默认 yaojiqiang@zhmag.com
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.163.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'yaojiq@163.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL || 'yaojiqiang@zhmag.com' }}
        run: python scripts/update_intel.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/intelligence.json data/update-history.json
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "auto: update intelligence $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
